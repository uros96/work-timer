<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Working Time – WTIS Parser (real-time)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="col left">
    <h1>Input log (paste)</h1>
    <textarea id="inputBox" spellcheck="false" placeholder="Paste WTIS log here"></textarea>
    <p class="muted">Format: type (<code>Entry</code>/<code>Exit</code>), location, timestamp
      <code>YYYY-MM-DD HH:MM</code> or <code>HH:MM:SS</code>. Columns may be separated by tabs or 2+ spaces.</p>
  </div>

  <div class="col right">
    <h1>Results</h1>

    <div class="section">
      <h2 style="margin:0 0 8px;font-size:16px">Daily summary</h2>
      <ul class="summaryList" id="dailySummary"></ul>
    </div>

    <div class="row" id="summaryRow"></div>

    <table id="intervalsTbl">
      <thead>
        <tr>
          <th>#</th>
          <th>From (Entry)</th>
          <th>To (Exit / now)</th>
          <th>Duration</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="notes" class="muted" style="margin-top:10px"></p>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
